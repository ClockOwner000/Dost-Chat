<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#008069">
<meta name="apple-mobile-web-app-title" content="Clock">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#efeae2;color:#111b21;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}

/* header */
header{background:#008069;color:#fff;padding:10px 6px 10px 12px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
.av{width:40px;height:40px;border-radius:50%;background:#d9fdd3;color:#008069;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.hd{flex:1;min-width:0}
.hd b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small{display:block;font-size:12.5px;opacity:.9;height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd small.ty{color:#d9fdd3;font-weight:600}
#more{background:none;border:0;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;line-height:1}
#more:active{background:rgba(255,255,255,.15)}

/* join */
#join{margin:auto;width:min(92%,360px);background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#join h2{margin:0 0 14px}
#join input{width:100%;margin-bottom:10px;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}
#join button{width:100%;padding:12px;border:0;border-radius:10px;background:#008069;color:#fff;font-weight:600}
#join p{font-size:13px;color:#667781;margin:10px 0 0}

/* chat */
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#sb{flex:none;padding:6px 10px;background:#f0f2f5}
#sq{width:100%;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;background:#fff;color:#111b21;outline:none}
body.dark #sb{background:#111b21}
body.dark #sq{background:#202c33;color:#e9edef}
#msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px;
  background-color:#efeae2;
  background-image:radial-gradient(rgba(11,20,26,.045) 1.2px,transparent 1.4px),radial-gradient(rgba(11,20,26,.03) 1px,transparent 1.2px);
  background-size:26px 26px,26px 26px;background-position:0 0,13px 13px}
.m{position:relative;max-width:82%;min-width:64px;padding:5px 8px 4px 9px;border-radius:8px;background:#fff;align-self:flex-start;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px .5px rgba(11,20,26,.13);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.m.me{background:#d9fdd3;align-self:flex-end}
.m.first{margin-top:6px}
.m.first:not(.me){border-top-left-radius:0}
.m.first.me{border-top-right-radius:0}
.m.flash{animation:fl 1.1s}
@keyframes fl{0%,60%{box-shadow:0 0 0 100vmax rgba(0,128,105,.18) inset}100%{box-shadow:0 1px .5px rgba(11,20,26,.13)}}
.n{display:block;font-size:12.5px;font-weight:600;color:#06cf9c;padding-right:18px}
.tx{display:inline}
.meta{float:right;margin:6px 0 -2px 10px;font-size:11px;color:#667781;white-space:nowrap;line-height:1.2}
.meta i{font-style:normal;margin-right:3px}
.tk{font-weight:700;letter-spacing:-2px;margin-left:3px}
.tk.s{color:#53bdeb}
.del{color:#667781;font-style:italic}
.q{display:block;border-left:4px solid #06cf9c;background:rgba(11,20,26,.06);border-radius:6px;padding:4px 8px;margin:1px 0 4px;cursor:pointer;overflow:hidden}
.me .q{background:rgba(11,20,26,.07)}
.q b{display:block;font-size:12.5px;color:#06cf9c}
.q span{display:block;font-size:13px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{position:absolute;top:1px;right:2px;width:22px;height:20px;border:0;background:none;color:#667781;font-size:14px;line-height:20px;padding:0;border-radius:6px;opacity:.85}
.me .ar{background:linear-gradient(90deg,transparent,#d9fdd3 40%)}

/* reply / edit bar */
#bar{display:none;background:#f0f2f5;padding:8px 10px 0;align-items:center;gap:8px}
#bar .bx{flex:1;min-width:0;background:#fff;border-left:4px solid #06cf9c;border-radius:8px;padding:6px 10px}
#bar b{display:block;font-size:12.5px;color:#06cf9c}
#bar span{display:block;font-size:13.5px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barx{border:0;background:none;font-size:20px;color:#667781;width:32px;height:32px}

footer{display:flex;gap:8px;padding:8px;background:#f0f2f5;padding-bottom:max(8px,env(safe-area-inset-bottom))}
footer input{flex:1;padding:12px 16px;border:0;border-radius:24px;font:inherit;outline:0;min-width:0}
footer button{width:46px;height:46px;border:0;border-radius:50%;background:#008069;color:#fff;font-size:19px;flex:none}

/* whatsapp look */
footer{background:transparent;gap:6px;padding:6px 8px}
.pill{flex:1;display:flex;align-items:center;background:#fff;border-radius:24px;padding:0 4px;min-width:0}
.pill input{background:transparent!important;padding:12px 4px!important;border-radius:0!important}
.pill button{width:38px;height:44px;background:none;color:#667781;font-size:21px;border-radius:0;flex:none}
#bar{background:transparent}
.m.first::before{content:"";position:absolute;top:0;width:9px;height:13px;background:inherit}
.m.first:not(.me)::before{left:-8px;clip-path:polygon(100% 0,100% 100%,0 0)}
.m.first.me::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.ds{align-self:center;background:#fff;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:8px;margin:8px 0 4px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.enc{align-self:center;max-width:88%;text-align:center;background:#ffeecd;color:#54656f;font-size:12.5px;padding:6px 10px;border-radius:8px;margin:4px 0 8px}
.rx{display:block;clear:both;width:fit-content;background:#fff;border-radius:12px;padding:1px 6px;font-size:14px;margin:2px 0 -12px;box-shadow:0 1px 2px rgba(11,20,26,.25)}
.m.hasrx{margin-bottom:12px}
.mi{display:block;max-width:100%;width:240px;border-radius:6px;margin:1px 0 3px;cursor:pointer}
#emp{display:none;grid-template-columns:repeat(8,1fr);gap:2px;background:#f0f2f5;padding:6px 8px;max-height:150px;overflow-y:auto}
#emp span{font-size:24px;text-align:center;padding:4px 0;cursor:pointer}
#menu .rr{display:flex;justify-content:space-around;padding:8px 6px;font-size:24px;border-bottom:1px solid rgba(128,128,128,.2)}
#menu .rr span{padding:0 4px}
#iv{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);align-items:center;justify-content:center}
#iv img{max-width:100%;max-height:100%}
body.dark{background:#0b141a;color:#e9edef}
body.dark header{background:#202c33}
body.dark #msgs{background-color:#0b141a;background-image:radial-gradient(rgba(255,255,255,.035) 1.2px,transparent 1.4px),radial-gradient(rgba(255,255,255,.025) 1px,transparent 1.2px)}
body.dark .m{background:#202c33;box-shadow:none}
body.dark .m.me{background:#005c4b}
body.dark .me .ar{background:linear-gradient(90deg,transparent,#005c4b 40%)}
body.dark .ar,body.dark .meta,body.dark .vl,body.dark .q span{color:#8696a0}
body.dark .pill{background:#2a3942}
body.dark #emp{background:#202c33}
body.dark .pill input{color:#e9edef}
body.dark .pill button{color:#8696a0}
body.dark #bar .bx{background:#1d282f}
body.dark #bar span{color:#8696a0}
body.dark #menu{background:#233138;color:#e9edef}
body.dark #menu div:active{background:#2a3942}
body.dark .ds{background:#182229;color:#8696a0}
body.dark .enc{background:#182229;color:#ffd279}
body.dark .rx{background:#233138}
body.dark #rec{background:#202c33;color:#e9edef}
body.dark .vb i{background:rgba(255,255,255,.2)}
body.dark .q{background:rgba(0,0,0,.25)}
body.dark #join{background:#202c33;color:#e9edef}
body.dark #join input{background:#2a3942;color:#e9edef;border-color:#2a3942}

/* voice */
.vc{display:flex;align-items:center;gap:8px;width:215px;max-width:100%;padding:2px 22px 2px 0}
.vp{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:#008069;color:#fff;font-size:14px;padding:0}
.vb{flex:1;height:22px;display:flex;align-items:center;cursor:pointer}
.vb i{display:block;width:100%;height:4px;border-radius:2px;background:rgba(11,20,26,.18);position:relative}
.vb i b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:#008069}
.vb i b::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#008069}
.vl{flex:none;font-size:12px;color:#667781;min-width:32px;text-align:right}
#rec{display:none;align-items:center;gap:12px;padding:8px 12px;background:#f0f2f5;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#rec .dot{width:11px;height:11px;border-radius:50%;background:#e53935;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#rec #rt{font-size:16px;font-variant-numeric:tabular-nums;flex:1}
#rcx{border:0;background:none;font-size:22px;width:40px;height:40px}
#rcs{width:46px;height:46px;border:0;border-radius:50%;background:#008069;color:#fff;font-size:19px}

/* floating menu */
#menu{position:fixed;display:none;z-index:50;background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(11,20,26,.28);min-width:170px;padding:6px 0}
#menu div{padding:11px 18px;font-size:15px}
#menu div:active{background:#f0f2f5}
#menu .red{color:#d32f2f}

/* recent-apps cover */
#cover{display:none;position:fixed;inset:0;z-index:9999;background:#000}
/* lock */
#lock{display:none;position:fixed;inset:0;z-index:100;background:#0b0f14;color:#e8eef5;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#lock svg{width:min(72vw,290px);height:auto;touch-action:none}
#ck-dig{font-size:46px;font-weight:300;letter-spacing:1px}
#ck-date{font-size:14px;opacity:.55}
#ck-ok{display:none;width:120px;height:42px;border:0;border-radius:10px;background:#25d366;color:#06281a;font-size:16px;font-weight:700;margin-top:6px}
#ck-word{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:15px;letter-spacing:3px;color:#e8eef5;opacity:.4;text-align:center}
#ck-o{display:inline-block;padding:14px 4px;margin:-14px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* video call */
#vcall,#acall{background:none;border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%}
#vcall:active,#acall:active{background:rgba(255,255,255,.15)}
#ringbar{display:none;position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:120;background:#1c2530;color:#fff;border-radius:14px;padding:10px 12px;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#ringbar .rb-txt small{display:block;opacity:.7;font-size:12px}
.rb-btns{display:flex;gap:8px}
.rb-btns button{width:42px;height:42px;border:0;border-radius:50%;font-size:18px}
.rb-ok{background:#25d366;color:#fff}
.rb-x{background:#e24747;color:#fff}
#callview{display:none;position:fixed;inset:0;z-index:130;background:#0b0f14}
#callview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#callview #remoteV{z-index:1}
@media (min-width:700px){#callview #remoteV{object-fit:contain}}
#callview #localV{z-index:3;width:110px;height:150px;top:max(12px,env(safe-area-inset-top));right:12px;left:auto;bottom:auto;border-radius:14px;border:2px solid rgba(255,255,255,.6);background:#222;transform:scaleX(-1);box-shadow:0 2px 10px rgba(0,0,0,.5)}
#callstate{z-index:4;position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;color:#fff;font-size:14px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:20px}
#callbtns{z-index:4;position:absolute;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:22px}
#callbtns button{width:54px;height:54px;border-radius:50%;border:0;font-size:22px;background:#1c2530;color:#fff}
#callbtns button.off{background:#e24747}
#cv-end{background:#e24747}
</style>
</head>
<body>
<header>
  <div class="av" id="avt">💬</div>
  <div class="hd"><b id="ttl">Dost Chat</b><small id="st"></small></div>
  <button id="acall" aria-label="Voice call">📞</button>
  <button id="vcall" aria-label="Video call">📹</button>
  <button id="more" aria-label="Settings">⋮</button>
</header>

<div id="join">
  <h2>Chat shuru karo</h2>
  <input id="name" placeholder="Aapka naam" maxlength="20">
  <input id="room" placeholder="Chat code (lamba aur secret, jaise: ali-sara-7391)" maxlength="40">
  <button id="go">Chat kholo</button>
  <p>Dost ko bhi yehi chat code batao. Jis ka code same hoga wahi chat dekh sakta hai.</p>
</div>

<div id="chat">
  <div id="sb"><input id="sq" type="text" placeholder="🔍 Search…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
  <div id="msgs"></div>
  <div id="bar"><div class="bx"><b id="bt"></b><span id="bs"></span></div><button id="barx">✕</button></div>
  <div id="rec"><button id="rcx" aria-label="Cancel">🗑️</button><span class="dot"></span><span id="rt">0:00</span><button id="rcs" aria-label="Send voice">➤</button></div>
  <div id="emp"></div>
  <footer id="ft">
    <div class="pill"><button id="emo" aria-label="Emoji">😊</button><input id="in" placeholder="Message likho…" autocomplete="off"><button id="att" aria-label="Photo">📎</button></div>
    <button id="send">➤</button>
  </footer>
  <input type="file" id="fi" accept="image/*,video/*" hidden>
</div>

<div id="menu"></div>
<div id="iv"><img alt=""></div>

<div id="lock">
  <svg viewBox="0 0 200 200" aria-label="Clock">
    <circle cx="100" cy="100" r="96" fill="#121922" stroke="#2b3846" stroke-width="3"/>
    <g id="ck-ticks" stroke="#8795a5"></g>
    <line id="ck-h" x1="100" y1="100" x2="100" y2="58" stroke="#e8eef5" stroke-width="5" stroke-linecap="round"/>
    <line id="ck-m" x1="100" y1="100" x2="100" y2="34" stroke="#e8eef5" stroke-width="3.5" stroke-linecap="round"/>
    <line id="ck-s" x1="100" y1="112" x2="100" y2="28" stroke="#ff9f43" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="4.5" fill="#ff9f43"/>
  </svg>
  <div id="ck-dig"></div>
  <div id="ck-date"></div>
  <button id="ck-ok">OK</button>
  <div id="ck-word">Cl<span id="ck-o">o</span>ck</div>
</div>

<div id="cover"></div>

<div id="ringbar">
  <div class="rb-txt"><b id="rb-name"></b><small id="rb-sm">Video call aa rahi hai</small></div>
  <div class="rb-btns"><button id="rb-dec" class="rb-x">✕</button><button id="rb-acc" class="rb-ok">📹</button></div>
</div>

<div id="callview">
  <video id="remoteV" autoplay playsinline></video>
  <video id="localV" autoplay playsinline muted></video>
  <div id="callstate"></div>
  <div id="callbtns">
    <button id="cv-mic">🎙️</button>
    <button id="cv-cam">🎥</button>
    <button id="cv-end">📞</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';if(v===null){localStorage.removeItem(k);return ''}localStorage.setItem(k,v)}catch(e){return ''}}
$('name').value=ls('dc_name'); $('room').value=ls('dc_room');
var cid=ls('dc_cid'); if(!cid){cid=Math.random().toString(36).slice(2,10); ls('dc_cid',cid);}

var all={}, seen={}, sentSeen={}, edits={}, dels={}, typers={}, dlv={}, reacts={}, hidden={}, peer=null;
var client=null, base='', myName='', conn='', replyTo=null, editing=null, lastTyping=0;

/* ---------- chat history is device par save hoti hai (IndexedDB) ---------- */
var DB=null, saveT=null, histKey='';
function dbOpen(cb){
  if(DB)return cb(DB);
  try{
    var r=indexedDB.open('dostchat',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
    r.onsuccess=function(){DB=r.result;cb(DB);};
    r.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}
function dbPut(k,v){ dbOpen(function(d){ if(!d)return; try{d.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){} }); }
function dbGet(k,cb){ dbOpen(function(d){ if(!d)return cb(null); try{ var q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=function(){cb(q.result||null)}; q.onerror=function(){cb(null)}; }catch(e){cb(null);} }); }
function dbDel(k){ dbOpen(function(d){ if(!d)return; try{d.transaction('kv','readwrite').objectStore('kv').delete(k);}catch(e){} }); }
function saveHist(){
  if(!histKey)return;
  var ids=Object.keys(all).sort(function(a,b){return all[b].ts-all[a].ts}), keep={}, size=0, n=0;
  for(var i=0;i<ids.length;i++){
    var m=all[ids[i]];
    size+=(m.img?m.img.length:0)+(m.audio?m.audio.length:0)+(m.video?m.video.length:0)+String(m.text||'').length+300;
    if(++n>5000||size>80e6)break;
    keep[ids[i]]=m;
  }
  dbPut(histKey,{all:keep,hidden:hidden,edits:edits,dels:dels,reacts:reacts,seen:seen,dlv:dlv});
}
function scheduleSave(){ if(!histKey||saveT)return; saveT=setTimeout(function(){saveT=null;saveHist();},800); }
function loadHist(cb){
  dbGet('h:'+base,function(st){
    try{
      if(st){
        Object.keys(st.all||{}).forEach(function(i){ if(!all[i])all[i]=st.all[i]; });
        Object.keys(st.hidden||{}).forEach(function(i){ hidden[i]=1; });
        Object.keys(st.edits||{}).forEach(function(i){ if(!edits[i])edits[i]=st.edits[i]; });
        Object.keys(st.dels||{}).forEach(function(i){ if(!dels[i])dels[i]=st.dels[i]; });
        Object.keys(st.seen||{}).forEach(function(i){ seen[i]=1; });
        Object.keys(st.dlv||{}).forEach(function(i){ dlv[i]=1; });
        Object.keys(st.reacts||{}).forEach(function(i){ reacts[i]=reacts[i]||{}; Object.keys(st.reacts[i]).forEach(function(c){ if(!reacts[i][c])reacts[i][c]=st.reacts[i][c]; }); });
      }
    }catch(e){}
    histKey='h:'+base; cb();
  });
}
document.addEventListener('visibilitychange',function(){ if(document.hidden)saveHist(); });
window.addEventListener('pagehide',saveHist);

/* ---------- helpers ---------- */
function clip(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}
function hash(s){var h=5381;s='dc|'+s;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function hhmm(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}

/* ---------- emoji mask + search secret code ---------- */
function sqSet(){return !!ls('dc_sq')}
var maskOn = ls('dc_mask')==='1' && !!ls('dc_sq'), sqText='';
var MASK_EM='😀 😂 😍 😎 🥳 😴 🤔 😇 🙃 😜 🤗 😋 🥰 😏 😅 🤩 😬 🙄 😌 😢 😡 🤠 🤓 😺 🐶 🐱 🦊 🐼 🐸 🐵 🌸 🌼 🍀 ⭐ 🌙 ☀️ 🔥 🍕 🍔 🍩 🍉 🍓 ☕ ⚽ 🎈 🎁 🎵 🚗 ✈️'.split(' ');
function seedOf(id){var n=0;String(id).split('').forEach(function(c){n+=c.charCodeAt(0)});return n}
function maskText(str,seed){
  var out='',i=0;
  Array.from(String(str||'')).forEach(function(ch){
    if(/\s/.test(ch)){out+=' ';return;}
    out+=MASK_EM[(ch.codePointAt(0)+i*7+seed)%MASK_EM.length]; i++;
  });
  return out;
}
function maskApply(on){
  maskOn=on; ls('dc_mask',on?'1':null);
  sqText=''; var q=$('sq'); if(q)q.value='';
  if(on){ stopPlayers(); cancelBar(); hideMenu(); $('iv').style.display='none'; $('emp').style.display='none'; $('in').value=''; updIcon(); }
  setStatus(); render(false);
}
function hideChat(){ stopRec(true); if(sqSet()&&!maskOn)maskApply(true); }
function setSq(){
  var c=prompt('Search ka secret code likho (kam se kam 3 akshar)'); if(c===null)return;

/* ---------- status / typing ---------- */
function setStatus(){
  var now=Date.now(), names=[];
  Object.keys(typers).forEach(function(c){ if(now-typers[c].ts<3500)names.push(typers[c].name); else delete typers[c]; });
  var st=$('st');
  if(names.length){st.textContent=names.join(', ')+' typing…';st.className='ty';}
  else{
    var tx=conn;
    if(conn==='online'||!conn){ tx=peer?((now-peer.ts<20000)?'online':'last seen '+hhmm(peer.ts)):''; }
    st.textContent=tx;st.className='';
  }
  $('ttl').textContent=(peer&&!maskOn)?peer.name:'Dost Chat'; $('avt').textContent=(peer&&!maskOn)?peer.name.charAt(0).toUpperCase():'💬';
  if(maskOn){st.textContent='';st.className='';}
}
setInterval(setStatus,1000);

function jumpTo(id){

/* ---------- swipe right = reply ---------- */
function attachSwipe(el,v){
  var sx=0,sy=0,dx=0,on=false,lock=false,lp=0;
  el.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('.ar'))return;
    on=true;lock=false;sx=e.clientX;sy=e.clientY;dx=0;el.style.transition='none';
    clearTimeout(lp);lp=setTimeout(function(){ if(on&&!lock){on=false;if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){} var r=el.getBoundingClientRect();msgMenu(v,{left:r.left,right:r.right,top:r.top,bottom:r.bottom});} },450);
  });
  el.addEventListener('pointermove',function(e){
    if(!on)return;
    var mx=e.clientX-sx,my=e.clientY-sy; if(Math.abs(mx)>8||Math.abs(my)>8)clearTimeout(lp);
    if(!lock){ if(Math.abs(my)>12&&Math.abs(my)>Math.abs(mx)){on=false;el.style.transform='';return;}
               if(mx>8&&Math.abs(mx)>Math.abs(my)){lock=true;try{el.setPointerCapture(e.pointerId)}catch(_){}} }
    if(lock){dx=Math.max(0,Math.min(mx,90));el.style.transform='translateX('+dx+'px)';}
  });
  el.addEventListener('contextmenu',function(e){e.preventDefault();msgMenu(v,{left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY})});
  function end(){
    clearTimeout(lp);
    if(!on&&!dx)return;
    on=false;el.style.transition='transform .18s';el.style.transform='';
    if(dx>=60){ if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){} setReply(v); }
    dx=0;
  }
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

/* ---------- voice messages ---------- */
var players={}, rec=null;
function fmt(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function voiceEl(v){
  var p=players[v.id];
  if(!p){
    var a=new Audio(v.audio); a.preload='metadata';
    p={a:a,ui:null};
    a.ontimeupdate=function(){ if(p.ui){p.ui.fill.style.width=Math.min(100,a.currentTime/(v.dur||a.duration||1)*100)+'%';p.ui.lbl.textContent=fmt(a.currentTime);} };
    a.onended=function(){ a.currentTime=0; if(p.ui){p.ui.btn.textContent='▶';p.ui.fill.style.width='0';p.ui.lbl.textContent=fmt(v.dur);} };
    players[v.id]=p;
  }
  var w=document.createElement('div');w.className='vc';
  var btn=document.createElement('button');btn.className='vp';btn.textContent=p.a.paused?'▶':'⏸';
  var bar=document.createElement('div');bar.className='vb';
  var tr=document.createElement('i'),fill=document.createElement('b');tr.appendChild(fill);bar.appendChild(tr);
  var lbl=document.createElement('span');lbl.className='vl';
  lbl.textContent=fmt(p.a.paused&&!p.a.currentTime?v.dur:p.a.currentTime);
  fill.style.width=Math.min(100,p.a.currentTime/(v.dur||1)*100)+'%';
  p.ui={btn:btn,fill:fill,lbl:lbl};
  btn.onclick=function(e){
    e.stopPropagation();
    if(p.a.paused){
      Object.keys(players).forEach(function(k){ if(players[k]!==p&&!players[k].a.paused){players[k].a.pause();if(players[k].ui)players[k].ui.btn.textContent='▶';} });
      p.a.play().catch(function(){}); btn.textContent='⏸';
    } else { p.a.pause(); btn.textContent='▶'; }
  };
  bar.onclick=function(e){
    e.stopPropagation();
    var r=tr.getBoundingClientRect(); p.a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(v.dur||p.a.duration||0);
  };
  w.appendChild(btn);w.appendChild(bar);w.appendChild(lbl);
  return w;
}
function stopPlayers(){ Object.keys(players).forEach(function(k){try{players[k].a.pause()}catch(_){}}); players={}; }

function startRec(){
  if(rec||!client||!client.connected)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert(mediaErr({name:'NoMedia'},false));return;}
  if(!window.MediaRecorder){alert('Is browser mein voice record nahi ho sakti. Chrome ya Safari (naya version) use karo.');return;}
  askMedia(false).then(function(stream){
   try{
    var types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];
    var mt=''; for(var i=0;i<types.length;i++){ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){mt=types[i];break;} }
    var mr; try{mr=mt?new MediaRecorder(stream,{mimeType:mt,audioBitsPerSecond:24000}):new MediaRecorder(stream);}catch(e){mr=new MediaRecorder(stream);}
    rec={mr:mr,chunks:[],t0:Date.now(),cancel:false,stream:stream,timer:null};
    mr.ondataavailable=function(e){ if(e.data&&e.data.size)rec.chunks.push(e.data); };
    mr.onstop=function(){
      var r=rec; rec=null; clearInterval(r.timer);
      r.stream.getTracks().forEach(function(t){t.stop()});
      $('rec').style.display='none'; $('ft').style.display='flex';
      var dur=Math.round((Date.now()-r.t0)/1000);
      if(r.cancel||dur<1||!r.chunks.length)return;
      var blob=new Blob(r.chunks,{type:r.mr.mimeType||mt||'audio/webm'});
      var fr=new FileReader();
      fr.onload=function(){ sendVoice(fr.result,dur); };
      fr.readAsDataURL(blob);
    };
    mr.start();
    $('ft').style.display='none'; $('rec').style.display='flex'; $('rt').textContent='0:00';
    rec.timer=setInterval(function(){
      var s=(Date.now()-rec.t0)/1000; $('rt').textContent=fmt(s);
      if(s>=60)stopRec(false);
    },250);
   }catch(err){ try{stream.getTracks().forEach(function(t){t.stop()})}catch(_){} rec=null; $('rec').style.display='none'; $('ft').style.display='flex'; alert('Voice record shuru nahi ho saki ('+((err&&err.name)||'error')+')'); }
  }, function(e){
    alert(mediaErr(e,false));
  });
}
function stopRec(cancel){ if(!rec)return; rec.cancel=!!cancel; try{rec.mr.stop()}catch(e){} }
$('rcx').onclick=function(){stopRec(true)};
$('rcs').onclick=function(){stopRec(false)};

/* ---------- messages ---------- */
function applyMods(m){
  if(edits[m.id]&&edits[m.id].cid===m.cid){m.text=edits[m.id].text;m.edited=1;}
  if(dels[m.id]&&dels[m.id]===m.cid){m.deleted=1;}
}
function merge(arr){ var ch=false; arr.forEach(function(m){ if(m&&m.id&&!all[m.id]){applyMods(m);all[m.id]=m;ch=true;} }); if(ch)render(true); }
function pub(topic,obj){ if(client&&client.connected)client.publish(base+'/'+topic,JSON.stringify(obj),{qos:1}); }
function sendSeen(ids){
  ids=ids.filter(function(i){return !sentSeen[i]});
  if(!ids.length||!client||!client.connected)return;
  ids.forEach(function(i){sentSeen[i]=1});
  pub('seen',{cid:cid,ids:ids});
}
function seenAll(){ sendSeen(Object.keys(all).filter(function(i){return all[i].cid!==cid&&!all[i].deleted})); }

function delMsg(id){
  var m=all[id]; if(!m||m.cid!==cid)return;
  if(!confirm('Ye message sab ke liye delete kar dein?'))return;
  m.deleted=1; dels[id]=cid; pub('del',{id:id,cid:cid});
  if(editing===id)cancelBar();
  render(true);
}

  merge([msg]); $('msgs').scrollTop=$('msgs').scrollHeight;

function start(){
  var name=$('name').value.trim(), room=$('room').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
  if(!name||room.length<4){alert('Naam likho aur kam se kam 4 akshar ka chat code do');return;}
  ls('dc_name',name); ls('dc_room',room); myName=name;
  $('join').style.display='none'; $('chat').style.display='flex'; conn='connecting…'; setStatus();
  base='dostchat-v1/'+room;
  loadHist(function(){ render(false); });
  client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{reconnectPeriod:3000,clean:true});
  var _pub0=client.publish; client.publish=function(tp){ try{ if(tp===base+'/msg')relayPush(arguments[1]); }catch(e){} return _pub0.apply(client,arguments); };
  client.on('connect',function(){ conn='online'; setStatus(); client.subscribe(base+'/vc',{qos:1}); client.subscribe([base+'/msg',base+'/seen',base+'/typing',base+'/edit',base+'/del',base+'/react',base+'/pres',base+'/rtc']); presPing(); client.publish(base+'/hist','',{retain:true}); });
  client.on('reconnect',function(){ conn='reconnecting…'; setStatus(); });
  client.on('offline',function(){ conn='offline'; setStatus(); });
  client.on('message',function(topic,payload){
    try{
      var d=JSON.parse(payload.toString()), t=topic.slice(base.length+1);
      if(t==='seen'){ if(d.cid!==cid){ (d.ids||[]).forEach(function(i){seen[i]=1;dlv[i]=1}); (d.dlv||[]).forEach(function(i){dlv[i]=1}); render(true); } }
      else if(t==='typing'){ if(d.cid!==cid){ typers[d.cid]={name:d.name,ts:Date.now()}; peer={cid:d.cid,name:d.name,ts:Date.now()}; setStatus(); }
      else if(t==='pres'){} }
      else if(t==='pres'){ if(d.cid!==cid){ var was=peer&&Date.now()-peer.ts<20000; peer={cid:d.cid,name:d.name,ts:Date.now()}; if(!was)presPing(); setStatus(); } }
      else if(t==='react'){ if(d.cid!==cid){ reacts[d.id]=reacts[d.id]||{}; if(d.e)reacts[d.id][d.cid]=d.e; else delete reacts[d.id][d.cid]; render(true); } }
      else if(t==='edit'){
        if(d.cid===cid)return;
        edits[d.id]={cid:d.cid,text:d.text};
        var m=all[d.id]; if(m&&m.cid===d.cid){m.text=d.text;m.edited=1;render(true);}
      }
      else if(t==='del'){
        if(d.cid===cid)return;
        dels[d.id]=d.cid;
        var m2=all[d.id]; if(m2&&m2.cid===d.cid){m2.deleted=1;render(true);}
      }
      else if(t==='rtc'){ if(d.cid!==cid) rtcHandle(d); }
      else if(t==='vc'){ vcPart(d); }

var pc=null, localStream=null, callPeerCid=null, callPeerName='', pendingOffer=null, micOn=true, camOn=true, callTimer=null;
var RTC_CFG={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};

  p.ontrack=function(e){ $('remoteV').srcObject=e.streams[0]; setCallState('Connected'); };

function rtcHandle(d){

    if(pc){ rtcSend({kind:'busy',cid:cid,to:d.cid}); return; }

  }
  else if(d.kind==='answer'){ if(pc&&callPeerCid===null){ callPeerCid=d.cid; pc.setRemoteDescription(d.sdp); } }
  else if(d.kind==='ice'){ if(pc&&(callPeerCid===d.cid||callPeerCid===null)) pc.addIceCandidate(d.candidate).catch(function(){}); }
  else if(d.kind==='end'){ if(pc||pendingOffer) endCall(true); }

function vcPart(p){

  var o=vids[p.id]||(vids[p.id]={n:p.n,parts:{},c:0});

function vidDone(id){

function sendVideo(dataUrl,dur){
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6), SZ=60000, n=Math.ceil(dataUrl.length/SZ);
  var msg={id:id,cid:cid,name:myName,text:'🎥 Video',video:dataUrl,vn:n,dur:Math.round(dur),ts:Date.now()};
  if(replyTo)msg.reply={id:replyTo.id,cid:replyTo.cid,name:replyTo.name,text:clip(replyTo.text,120)};
  replyTo=null; updateBar();
  merge([msg]); $('msgs').scrollTop=$('msgs').scrollHeight;
  if(!client||!client.connected)return;
  var meta={}; Object.keys(msg).forEach(function(k){ if(k!=='video')meta[k]=msg[k]; });
  client.publish(base+'/msg',JSON.stringify(meta),{qos:1});
  var i=0;
  (function next(){
    if(i>=n||!client||!client.connected)return;
    client.publish(base+'/vc',JSON.stringify({id:id,cid:cid,i:i,n:n,d:dataUrl.substr(i*SZ,SZ)}),{qos:1});
    i++; setTimeout(next,40);
  })();
}
function sendVideoFile(f){
  var vid=document.createElement('video'), u=URL.createObjectURL(f);
  vid.preload='auto'; vid.playsInline=true; vid.src=u;
  vid.onerror=function(){ URL.revokeObjectURL(u); alert('Ye video khul nahi saki.'); };
  vid.onloadedmetadata=function(){
    if(!isFinite(vid.duration)||vid.duration>30){ URL.revokeObjectURL(u); alert('Video 30 second se chhoti rakho.'); return; }
    if(typeof MediaRecorder==='undefined'){ URL.revokeObjectURL(u); alert('Is browser mein video bhejna support nahi.'); return; }
    compressVideo(vid,u);
  };
}
function compressVideo(vid,u){
  var btn=$('att'); btn.textContent='⏳'; btn.disabled=true;
  var k=Math.min(1,360/Math.min(vid.videoWidth,vid.videoHeight)), cw=Math.max(2,Math.round(vid.videoWidth*k/2)*2), ch=Math.max(2,Math.round(vid.videoHeight*k/2)*2);
  var c=document.createElement('canvas'); c.width=cw; c.height=ch; var g=c.getContext('2d');
  var stream=c.captureStream(24), ac=null, tm=null, iv=null, finished=false, chunks=[];
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)(); ac.resume();
    var src=ac.createMediaElementSource(vid), dst=ac.createMediaStreamDestination(); src.connect(dst);
    dst.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)});
  }catch(e){}
  var mt=''; ['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm','video/mp4'].forEach(function(t){ if(!mt&&MediaRecorder.isTypeSupported(t))mt=t; });
  var mr;
  try{ mr=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:250000,audioBitsPerSecond:32000}:{videoBitsPerSecond:250000}); }
  catch(e){ btn.textContent='📎'; btn.disabled=false; URL.revokeObjectURL(u); alert('Video taiyar nahi ho saki.'); return; }
  function reset(){ btn.textContent='📎'; btn.disabled=false; clearInterval(iv); clearTimeout(tm); URL.revokeObjectURL(u); try{ac&&ac.close()}catch(e){} }
  mr.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); };
  mr.onstop=function(){
    reset();
    var blob=new Blob(chunks,{type:mr.mimeType||'video/webm'});
    if(blob.size>2e6){ alert('Video bohot bari hai. Chhoti video bhejo.'); return; }
    var fr=new FileReader(); fr.onload=function(){ sendVideo(fr.result,vid.duration); }; fr.readAsDataURL(blob);
  };
  function finish(){ if(finished)return; finished=true; try{vid.pause()}catch(e){} try{mr.stop()}catch(e){ reset(); } }
  vid.onended=finish;
  tm=setTimeout(finish,(vid.duration+4)*1000);
  mr.start(500);
  vid.play().then(function(){ iv=setInterval(function(){ try{g.drawImage(vid,0,0,cw,ch)}catch(e){} },42); }).catch(function(){ finished=true; try{mr.stop()}catch(e){} reset(); alert('Video chalane ki ijazat nahi mili.'); });
}

/* ---------- keyboard overlap fix ---------- */
(function(){
  var vv=window.visualViewport;
  function fix(){
    if(!vv)return;
    document.body.style.height=vv.height+'px';
    window.scrollTo(0,0);
    var box=$('msgs'); if(box)box.scrollTop=box.scrollHeight;
  }
  if(vv){ vv.addEventListener('resize',fix); vv.addEventListener('scroll',fix); }
  $('in').addEventListener('focus',function(){ setTimeout(fix,250); setTimeout(fix,500); });
  $('in').addEventListener('blur',function(){ document.body.style.height=''; });
})();
